<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070a0e"><title>另一条人生｜半格电</title>
<style>
:root{--bg:#070a0e;--panel:#10151c;--line:#29333d;--text:#edf2f3;--muted:#89949e;--a:#8fe3c2}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -10%,#18222d,#070a0e 45%);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,"Noto Sans SC",monospace}
.wrap{max-width:720px;margin:auto;min-height:100vh;padding:22px 17px 44px}
.top{display:flex;justify-content:space-between;color:#71808b;font-size:11px;letter-spacing:.1em}
.brand{color:var(--a)}
.screen{display:none;min-height:85vh}
.active{display:flex;flex-direction:column;justify-content:center;animation:f .35s}
h1{font-size:39px;line-height:1.1;margin:14px 0}
h2{font-size:27px}
.lead{line-height:1.8;color:#cbd2d7}

.sym{font-size:28px;text-align:center;padding:21px}

.tiny{text-align:center;color:#65717c;font-size:11px;margin-top:15px}

.tip{font-size:12px;color:#7f8a94;text-align:center;margin-top:8px}
.cardpreview{display:block;width:100%;max-width:100%;height:auto;border-radius:16px;border:1px solid #35414c;background:#080b0e}
.scan{position:fixed;left:0;right:0;height:1px;background:#9fffd944;animation:scan 6s linear infinite;pointer-events:none}
@keyframes scan{from{top:0}to{top:100vh}}
@keyframes f{from{opacity:0;transform:translateY(7px)}to{opacity:1}}
@media(max-width:420px){h1{font-size:34px}.job{font-size:31px}.wrap{padding:18px 14px 36px}}

.sharecard{background:#080b0e;border:1px solid #3a444d;border-radius:18px;overflow:hidden;color:#edf2f3;box-shadow:0 18px 60px #0008;aspect-ratio:3/4;display:flex;flex-direction:column}

</style></head><body><div class="scan"></div><div class="wrap"><div class="top"><span class="brand">半格电 // HALF BATTERY</span><span>PARALLEL ARCHIVE</span></div>
<section id="s0" class="screen active"><div class="muted">ANOTHER LIFE FOUND</div><h1>这个世界里，<br>好像还有一个你。</h1><p class="lead">系统找到了一份与你高度匹配的人生档案。它不属于当前世界线。</p><button class="btn primary" onclick="show('s1')">查看我的档案</button><div class="tiny">无需登录 · 大约 10 秒</div></section>

<div id="modal" class="modal"><div class="modalin">
<div class="modalTop"><button class="btn closeMini" onclick="modal.classList.remove('on')">关闭</button></div>
<p class="helper">你的另一条人生已归档。保存这张居民档案卡。</p>
<img id="sharePreview" class="cardpreview" alt="居民档案卡">

<script>
const LIVES=[{"id": "mirror", "job": "镜像替身演员", "altjob": "镜面异常代理人", "world": "2191 年，人类证明镜子里的自己并不总是在模仿你。大型私人镜面随后被严格限制。", "work": "你替高风险客户进入受控镜室。如果镜中的“你”做出不同动作，你负责记录；如果它开口，立即离开。", "event": "工作第 11 年，镜中的你在玻璃上写下你的出生年份。你查到：那一年，这座城市没有你的出生记录。", "secret": "你偷偷进入 27 间镜室。每一面镜子里的你都认识你，而且它们似乎认为你才是镜像。", "ending": "你最后一次走出镜室后，DNA、指纹全部一致，唯一变化是从右利手变成了左利手。", "legacy": "一面从来不映出任何人的镜子", "trust": "50.0%", "rare": "0.31%", "danger": "★★★★☆", "freedom": "★★☆☆☆", "img": "assets/char_01.jpg"}, {"id": "memory", "job": "记忆销毁员", "altjob": "遗忘服务技师", "world": "这个世界允许成年人合法删除痛苦记忆，遗忘成为一种公共服务。", "work": "你删除客户主动放弃的记忆：失恋、死亡、战争和秘密。", "event": "一位客人删除了 32 年记忆。操作结束后你才发现，那 32 年里全部都是你。", "secret": "你发现所谓“永久删除”的 4,721 份记忆其实仍被秘密保存。", "ending": "43 岁后官方档案中断。废弃区开始流传一个免费替人恢复记忆的人。", "legacy": "4,721 段本应消失的陌生人记忆", "trust": "91%", "rare": "0.58%", "danger": "★★☆☆☆", "freedom": "★★★★☆", "img": "assets/char_02.jpg"}, {"id": "key", "job": "禁门钥匙保管员", "altjob": "封闭区域管理员", "world": "城市有 143 扇法律规定永远不能打开的门，每扇门都有一把真实存在的钥匙。", "work": "你每月确认 143 把钥匙仍然存在，并签字证明没有门被打开。", "event": "第 9 年，你清点出了第 144 把钥匙。钥匙柄刻着你家的地址。", "secret": "你第一次发现卧室衣柜后的墙比建筑图纸厚 73 厘米。", "ending": "第二天禁门数量变成 144，你的住址则从所有公开地图上消失。", "legacy": "一把没有编号、至今仍在流通的钥匙", "trust": "88%", "rare": "0.83%", "danger": "★★★☆☆", "freedom": "★★★☆☆", "img": "assets/char_03.jpg"}, {"id": "signal", "job": "失联文明接线员", "altjob": "夜间信号监听员", "world": "人类在太阳系建立了 36 个永久居住点，但每天仍有少量通讯信号找不到发送者。", "work": "你只在夜间工作，监听无法识别来源的窄带信号。职业守则第一条：不要回复。", "event": "你听见一个声音连续报出未来日期。最后一个日期是明天。第二天什么也没发生。", "secret": "重新播放录音时，你听见日期后还有一句：因为你听见了，所以没有发生。", "ending": "23 年间你记录了 81 次从未发生的灾难。没人知道是不是你阻止了它们。", "legacy": "81 个不存在的历史事件", "trust": "86%", "rare": "0.19%", "danger": "★★★☆☆", "freedom": "★★★★★", "img": "assets/char_04.jpg"}, {"id": "dream", "job": "梦境取证员", "altjob": "睡眠现场调查员", "world": "法院承认梦境可以作为有限证据，但必须由持证取证员进入当事人的睡眠记录。", "work": "你寻找梦里被篡改的细节，判断一段记忆究竟来自现实还是植入。", "event": "一次取证中，你在陌生人的梦里看见了自己童年的卧室，连墙上的裂缝都完全一致。", "secret": "之后你在 14 个互不认识的人梦里发现同一间房。", "ending": "官方认定这是群体性记忆污染；你却在现实中找到了那间房的地址。", "legacy": "一张从梦里带回现实的门票", "trust": "73%", "rare": "0.44%", "danger": "★★★☆☆", "freedom": "★★★☆☆", "img": "assets/char_05.jpg"}, {"id": "weather", "job": "天气修复师", "altjob": "局部气候技师", "world": "极端气候后，大城市开始人工维护天气。晴天、降雨和风都成为基础设施。", "work": "你负责修复失控的局部天气，让一条街重新下雨，或让一片云离开机场。", "event": "某天系统要求你修复一场持续 17 年、只落在一栋废弃房屋上的雨。", "secret": "进入房屋后，你发现雨水从屋内向天空落去。", "ending": "你关闭设备后，那片区域第一次放晴；同一天，全球气象数据库丢失了 17 年记录。", "legacy": "装着最后一滴逆向雨水的玻璃瓶", "trust": "95%", "rare": "0.67%", "danger": "★★☆☆☆", "freedom": "★★★★☆", "img": "assets/char_06.jpg"}, {"id": "time", "job": "时间遗物鉴定员", "altjob": "异常年代鉴定师", "world": "考古队偶尔会挖出制造日期晚于出土日期的物品，它们被称为时间遗物。", "work": "你鉴定这些东西是否来自未来，并确定它们原本属于哪个年代。", "event": "你收到一块损坏的旧表，生产日期是 18 年后，背面刻着你的名字。", "secret": "表内部保存着一张只有你和一个陌生人的合照。", "ending": "你一直没有见过照片中的人，直到退休当天有人敲响办公室的门。", "legacy": "一块始终快 18 年的手表", "trust": "82%", "rare": "0.52%", "danger": "★★☆☆☆", "freedom": "★★★★☆", "img": "assets/char_07.jpg"}, {"id": "ruin", "job": "废弃城市管理员", "altjob": "无人区维护员", "world": "人口迁移后，旧大陆留下大量完整却无人居住的城市。法律要求它们在拆除前继续维持最低运行。", "work": "你独自维护一座没有居民的城市：路灯、地铁、广播和红绿灯仍按时工作。", "event": "第 6 年，你发现每天凌晨 02:17 都有人按下同一个人行横道按钮。", "secret": "监控从未拍到任何人，但按钮周围开始出现越来越多脚印。", "ending": "你申请关闭城市，系统回复：申请驳回，当前登记居民数 1。", "legacy": "一张只写着你名字的城市人口表", "trust": "77%", "rare": "0.91%", "danger": "★★☆☆☆", "freedom": "★★★★★", "img": "assets/char_08.jpg"}, {"id": "moon", "job": "人工月亮维护员", "altjob": "轨道照明工程师", "world": "真正的月亮因轨道事故不再可见，人类用 19 颗反射卫星维持夜间月光。", "work": "你负责校准人工月亮，让不同城市在正确时间拥有月相。", "event": "一次维修时，你发现第 20 个未登记光源正在模仿整个月相系统。", "secret": "它没有轨道编号，也没有任何国家承认发射过它。", "ending": "三个月后它突然熄灭。那一夜，真正的月亮在天空中出现了 11 分钟。", "legacy": "第 20 颗月亮掉落的一小片反射材料", "trust": "93%", "rare": "0.26%", "danger": "★★★★☆", "freedom": "★★★★☆", "img": "assets/char_09.jpg"}, {"id": "archive", "job": "历史漏洞调查员", "altjob": "档案矛盾审计员", "world": "所有公共历史被数字化后，系统开始自动标记互相矛盾的史料。极少数矛盾无法解释。", "work": "你调查那些“不可能同时为真”的历史记录，并决定哪一个版本被保留。", "event": "你发现一场著名事故同时存在两份完整记录：一份死了 312 人，一份无人死亡。", "secret": "两个版本里的幸存者都还活着，并且都记得自己的版本。", "ending": "你拒绝删除任何一份记录。第二天系统把你标记为“历史矛盾”。", "legacy": "两份都盖有真章的死亡名单", "trust": "61%", "rare": "0.38%", "danger": "★★★☆☆", "freedom": "★★☆☆☆", "img": "assets/char_10.jpg"}, {"id": "relic", "job": "陌生人记忆保管员", "altjob": "私人记忆仓库管理员", "world": "人们可以在生前寄存一段记忆，指定多年后交给一个尚未认识的人。", "work": "你保管这些延迟送达的记忆，并在指定日期寻找收件人。", "event": "一份封存 63 年的记忆指定你本人为收件人，而寄存日期早于你出生。", "secret": "记忆内容只是一个陌生人坐在海边等你，并反复说：这次不要迟到。", "ending": "你按记忆中的地点去了海边。那里已经有人等了 63 年。", "legacy": "一段没有寄件人姓名的海浪声", "trust": "89%", "rare": "0.63%", "danger": "★☆☆☆☆", "freedom": "★★★★☆", "img": "assets/char_11.jpg"}, {"id": "deep", "job": "深海灯塔守望员", "altjob": "海底航标维护员", "world": "海平面上升后，大量城市沉入海底。旧航道仍由自动灯塔标记，以避免潜航器进入遗迹。", "work": "你驻守最深的一座灯塔，每 90 天才有人来换班。", "event": "某晚，灯塔下方亮起了另一束光，并用古老航海信号向你发送：请关灯。", "secret": "档案显示，那下面曾经有一座城市，但它已经沉没 146 年。", "ending": "你没有关灯。第二天声呐显示海底城市的街道上出现了移动目标。", "legacy": "一盏从未被海水熄灭的旧式航灯", "trust": "84%", "rare": "0.74%", "danger": "★★★★☆", "freedom": "★★★★★", "img": "assets/char_12.jpg"}];

function wrap(ctx,t,x,y,max,lineH,maxLines=99){let arr=[],line="";for(let ch of t){let test=line+ch;if(ctx.measureText(test).width>max&&line){arr.push(line);line=ch}else line=test}if(line)arr.push(line);arr.slice(0,maxLines).forEach((a,i)=>ctx.fillText(a,x,y+i*lineH));return y+Math.min(arr.length,maxLines)*lineH}

let cardDataUrl="";

function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight, maxLines){
  const chars=[...text];
  const lines=[];
  let line="";
  for(const ch of chars){
    const test=line+ch;
    if(ctx.measureText(test).width>maxWidth && line){
      lines.push(line);
      line=ch;
      if(lines.length>=maxLines) break;
    }else{
      line=test;
    }
  }
  if(lines.length<maxLines && line) lines.push(line);
  if(lines.length===maxLines && chars.join("").length>lines.join("").length){
    let last=lines[maxLines-1];
    while(ctx.measureText(last+"…").width>maxWidth && last.length>0) last=last.slice(0,-1);
    lines[maxLines-1]=last+"…";
  }
  lines.forEach((ln,i)=>ctx.fillText(ln,x,y+i*lineHeight));
  return y + lines.length*lineHeight;
}

function drawCover(ctx,img,x,y,w,h){
  const r=Math.max(w/img.naturalWidth,h/img.naturalHeight);
  const sw=w/r, sh=h/r;
  const sx=(img.naturalWidth-sw)/2;
  const sy=Math.max(0,(img.naturalHeight-sh)*0.28);
  ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);
}

async function makeCard(){
  try{
    if(!cur){alert("请先生成人生档案。");return}
    const displayJob = document.querySelector('.job')?.textContent?.trim() || cur.job;
    const dangerN=(cur.danger.match(/★/g)||[]).length;
    const freedomN=(cur.freedom.match(/★/g)||[]).length;

    const W=1080,H=1440;
    const c=document.createElement("canvas");
    c.width=W;c.height=H;
    const ctx=c.getContext("2d");

    ctx.fillStyle="#080b0e";
    ctx.fillRect(0,0,W,H);

    ctx.strokeStyle="#35414c";
    ctx.lineWidth=4;
    ctx.strokeRect(2,2,W-4,H-4);

    ctx.font='32px ui-monospace, monospace';
    ctx.fillStyle="#8fe3c2";
    ctx.fillText("PARALLEL LIFE ARCHIVE",54,70);
    ctx.textAlign="right";
    ctx.fillText(code,1025,70);
    ctx.textAlign="left";

    const img=new Image();
    img.crossOrigin="anonymous";
    img.src=cur.img;
    await new Promise((resolve,reject)=>{
      img.onload=resolve;
      img.onerror=reject;
    });
    drawCover(ctx,img,0,105,W,500);

    ctx.fillStyle="#080b0e";
    ctx.fillRect(0,605,W,H-605);

    ctx.fillStyle="#8fe3c2";
    ctx.font='28px ui-monospace, monospace';
    ctx.fillText("CITIZEN RECORD // 另一条人生",54,665);

    ctx.fillStyle="#f3f6f7";
    ctx.font='700 60px "Microsoft YaHei","Noto Sans SC",sans-serif';
    drawWrappedText(ctx,displayJob,54,745,970,70,1);

    ctx.fillStyle="#9aa5ad";
    ctx.font='34px "Microsoft YaHei","Noto Sans SC",sans-serif';
    ctx.fillText(`${year} 年出生 · ${place}`,54,810);

    const boxes=[
      ["稀有度",cur.rare],
      ["可信度",cur.trust],
      ["危险程度",`${dangerN}/5`],
      ["自由程度",`${freedomN}/5`]
    ];
    const bx=[54,553], by=[855,1015], bw=473,bh=130;
    boxes.forEach((it,i)=>{
      const col=i%2,row=Math.floor(i/2),x=bx[col],y=by[row];
      ctx.strokeStyle="#35414c"; ctx.lineWidth=3;
      ctx.beginPath(); ctx.roundRect(x,y,bw,bh,22); ctx.stroke();
      ctx.fillStyle="#9aa5ad";
      ctx.font='26px "Microsoft YaHei","Noto Sans SC",sans-serif';
      ctx.fillText(it[0],x+28,y+42);
      ctx.fillStyle="#f3f6f7";
      ctx.font='700 42px ui-monospace, monospace';
      ctx.fillText(it[1],x+28,y+96);
    });

    ctx.fillStyle="#8fe3c2";
    ctx.font='26px ui-monospace, monospace';
    ctx.fillText("TURNING POINT // 人生转折点",54,1195);

    ctx.fillStyle="#8fe3c2";
    ctx.fillRect(54,1225,5,120);

    ctx.fillStyle="#f0f3f4";
    ctx.font='31px "Microsoft YaHei","Noto Sans SC",sans-serif';
    drawWrappedText(ctx,cur.event,82,1265,900,45,3);

    ctx.strokeStyle="#29333d";
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(54,1370); ctx.lineTo(1026,1370); ctx.stroke();

    ctx.fillStyle="#6d7983";
    ctx.font='22px ui-monospace, monospace';
    ctx.fillText("半格电 // HALF BATTERY",54,1410);
    ctx.textAlign="right";
    ctx.fillText("ANOTHER LIFE. STILL YOU.",1026,1410);
    ctx.textAlign="left";

    cardDataUrl=c.toDataURL("image/png");
    sharePreview.src=cardDataUrl;
    modal.classList.add("on");
    modal.scrollTop=0;
  }catch(e){
    alert("档案卡生成失败："+(e&&e.message?e.message:"未知错误"));
  }
}

function saveCard(){
  try{
    if(!cardDataUrl){alert("请先生成居民档案卡。");return}
    const title=(document.querySelector('.job')?.textContent || cur.job).replace(/[\\/:*?"<>|]/g,'');
    const a=document.createElement("a");
    a.download=`半格电_${title}_${code}.png`;
    a.href=cardDataUrl;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }catch(e){
    alert("保存图片失败，请长按图片或截图保存。");
  }
}
